[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptci"
version = "0.1.0"
description = "Catch LLM quality regressions in CI when a prompt or model changes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bereket Abebe" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
promptci = "promptci.cli:main"

[tool.setuptools.packages.find]
include = ["promptci*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
